name: "📚 Documentação"
description: "Crie ou atualize documentação do projeto"
title: "[DOCS] "
labels: ["documentation"]
assignees: []

body:
  - type: textarea
    id: context
    attributes:
      label: Contexto
      description: Por que a documentação precisa ser criada ou atualizada?
      placeholder: "Ex.: O processo para importar o banco no phpMyAdmin ainda não está documentado."
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Objetivo
      description: O que deverá ser documentado?
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Tipo de documentação
      options:
        - label: README
        - label: Setup/XAMPP
        - label: Banco de dados
        - label: Arquitetura
        - label: Manual de uso
        - label: Outra documentação

  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceitação
      placeholder: |
        - [ ] Documentação atualizada
        - [ ] Instruções testadas por outro integrante
        - [ ] Links e exemplos revisados
    validations:
      required: true
