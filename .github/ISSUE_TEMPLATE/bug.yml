name: "🐞 Bug"
description: "Registre um erro ou comportamento inesperado"
title: "[BUG] "
labels: ["bug"]
assignees: []

body:
  - type: textarea
    id: problem
    attributes:
      label: Descrição do problema
      description: Explique o erro encontrado.
      placeholder: "Ex.: Ao enviar o formulário de login com dados válidos, o usuário não é redirecionado."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      description: Liste os passos necessários para reproduzir o problema.
      placeholder: |
        1. Acessar /login
        2. Informar usuário e senha válidos
        3. Clicar em Entrar
        4. Observar o comportamento
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
      description: O que deveria acontecer?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportamento atual
      description: O que acontece atualmente?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidências
      description: Adicione mensagens de erro, screenshots ou logs sem expor senhas/credenciais.

  - type: input
    id: environment
    attributes:
      label: Ambiente
      description: Informe sistema, navegador e contexto do XAMPP quando relevante.
      placeholder: "Windows 11 | Chrome | XAMPP | PHP"

  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceitação
      placeholder: |
        - [ ] Problema corrigido
        - [ ] Correção testada localmente
        - [ ] Fluxo principal continua funcionando
        - [ ] Pull Request revisado
    validations:
      required: true
